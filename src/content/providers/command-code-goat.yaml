# Command Code Goat — 订阅聚合（mock 数据，非真实报价）
# 虚构的编程向聚合订阅：月费 $10 + 7% 手续费，共享资源池，按模型消耗池内 credits。
# 所有价格均为虚构示例，用于本站 UI 演示，不代表任何真实服务商的价格。
id: command-code-goat
name: Command Code Goat
nameZh: 编程码羊聚合
kind: subscription
currency: USD
description: >-
  mock 数据（虚构服务）：编程向聚合订阅商。一次月费进入共享资源池，各模型按
  每百万 token 的 $ 定价消耗池内 credits。模型定价为虚构示例，用于演示订阅聚合
  与官方 API 的价格对比，不代表真实厂商报价。
billing:
  baseFee: 10
  feePct: 7
  currency: USD
  poolNote: 月费 $10 + 7% 手续费，共享资源池，按模型消耗池内 credits
plans:
  - id: go
    name: Go 套餐
    baseFee: 8
    currency: CNY
    feePct: 0
    quotaType: currency
    quotaAmount: 10
    quotaCurrency: USD
    rateLimit:
      hasLimit: unknown
    poolNote: 8元/月，提供 10 美元额度
  - id: goat
    name: Goat 套餐
    baseFee: 10
    currency: USD
    feePct: 7
    quotaType: currency
    quotaAmount: 60
    quotaCurrency: USD
    rateLimit:
      hasLimit: 'yes'
      rolling5h: 20次或$5
      monthly: 60美元
    poolNote: 10美元/月 + 7% 手续费，提供 60 美元额度
